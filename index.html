<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spesial Buat Kamu ❤️</title>
    <!-- Mengimpor Font Estetik dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Mengimpor Library Konfeti untuk Efek Perayaan -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #4a4a4a;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            color: #ff4757;
            margin-bottom: 15px;
        }
        p {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #666;
        }
        .btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.3s ease;
            box-shadow: 0 4px 10px rgba(255, 71, 87, 0.3);
        }
        .btn:hover {
            background-color: #ff6b81;
        }
        .hidden-message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #fff0f1;
            border-radius: 10px;
            border-left: 4px solid #ff4757;
            font-size: 14px;
            color: #333;
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Hai, Sayang! ❤️</h1>
        <p>aku mau bilang makasi buat kamu karna udah bertahab sejauh ini.</p>
        
        <button class="btn" onclick="bukaKejutan()">Klik Kejutan Ini ✨</button>

        <div id="pesanRahasia" class="hidden-message">
            <strong>Yeay! 🎉</strong><br>
            Tapi kayanya hubungan kita sampe sini aja.aku ngerasa kaya kita semakin jauh
        </div>
    </div>

    <script>
        function bukaKejutan() {
            // Menampilkan pesan tersembunyi
            const pesan = document.getElementById('pesanRahasia');
            pesan.style.display = 'block';

            // Memicu efek kembang api / konfeti
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        }
    </script>

</body>
</html>
